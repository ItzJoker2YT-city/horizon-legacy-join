# Horizon Legacy Join — join servers of 1.8.x..1.20.1 from Horizon.
# Native mod bundle: hooks into the game's own network stack before the handshake,
# and drives a per-connection legacy bridge inside horizon-protocol's adapter.
[mod]
id = "horizon-legacy-join"
version = "0.1.0"
priority = 10

# The Nightly commit (tag `nightly[14706039]: "Next Steps: extend ID helpers (#8718)"` base) this
# bundle was made and CI-checked against — Nov 8 2026 main. Re-pin after every upstream update.
[compatibility]
horizon_revision = "5f7cadfff0fc073c0e4a68558754578c0d680a29"

# ---------------------------------------------------------------- helpers ---
# Every hook is a cancellable HEAD injection: it does the legacy decision
# itself and breaks with the target result, or continues into the untouched
# original body (which is where this tool refuses rewrites anyway — upstream
# bodies carry closures and flow the planner does not verify).

# 1. Resolve what the server speaks by its status ping; record a covered lane
#    for adapt, break with the marker. Upstream versions break with their own
#    resolution; ping failures break with None.
[[injection]]
id = "resolve_older_server"
target = "horizon_client::net::older_server"
kind = "HEAD"
cancellable = true
helper = "helpers/older_server.rs"
bindings = [{ name = "address", ty = "&str", value = "address" }]

# 2. Attach the stamped legacy session when older_server recorded a lane;
#    everything else lets the original body attach upstream's own session.
[[injection]]
id = "adapt_connection"
target = "horizon_protocol::connection::Connection::adapt"
kind = "HEAD"
cancellable = true
helper = "helpers/adapt.rs"
bindings = [
  { name = "conn", ty = "&mut Connection", value = "&mut *self" },
  { name = "version", ty = "crate::adapter::ServerVersion", value = "version" },
]

# 3. The reader: with a stamped session, drain its fabricated packets and
#    translate what arrives; without one the original body runs.
[[injection]]
id = "reader_recv"
target = "horizon_protocol::connection::ConnReader::recv"
kind = "HEAD"
cancellable = true
helper = "helpers/recv.rs"
bindings = [{ name = "reader", ty = "&mut ConnReader", value = "&mut *self" }]

# 4. The writer: with a stamped session, translate before framing; without
#    one the original body runs.
[[injection]]
id = "writer_send"
target = "horizon_protocol::connection::ConnWriter::send"
kind = "HEAD"
cancellable = true
helper = "helpers/send.rs"
bindings = [
  { name = "writer", ty = "&mut ConnWriter", value = "&mut *self" },
  { name = "body", ty = "&[u8]", value = "body" },
]

# ---------------------------------------------------------------- modules ---
# The whole legacy engine, inside the adapter module tree (same-crate privacy:
# it can read the adapter's private submodules, tables and the legacy registries).
[[module]]
id = "engine"
file = "crates/horizon-protocol/src/adapter.rs"
name = "legacy_join"
source = "engine/legacy_bridge.rs"
visibility = "pub"

# ------------------------------------------------------------ the crate ------
# The generated lane tables: a crate of the mod's own, compiled into
# horizon-protocol (the engine's home crate). No repository dependencies: the
# tables are those consts, generated by tools/generate_data.py.
[[crate]]
id = "legacy_data"
path = "legacy_data"
dependent = "horizon-protocol"

# ---------------------------------------------------------------- state ------
# Which lane protocol a stamped legacy session drives (0 = upstream's own
# adapter session). Session::new initializes it; the adapt hook stamps it.
[[state]]
id = "lane_protocol"
target = "horizon_protocol::adapter::session::Session"
ty = "std::sync::atomic::AtomicI32"
initial = "::std::sync::atomic::AtomicI32::new(0)"

[[state.constructor]]
target = "horizon_protocol::adapter::session::Session::new"
selector = "Self"
require = 1

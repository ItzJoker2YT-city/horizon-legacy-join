name: build-and-release
# Every build publishes an alpha/beta release of the bundle (alpha.N rises per
# run; the release notes say which lanes are wired and what changed).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Horizon Nightly commit the bundle is pinned to (horizon-mixin.toml agrees).
  HORIZON_REV: "5f7cadfff0fc073c0e4a68558754578c0d680a29"
  # The horizon-mixins commit the bundle applies with.
  MIXINS_REV: "main"
  RUST: "1.95.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The Horizon source at the pinned commit
        run: |
          git init horizon
          git -C horizon remote add origin https://github.com/horizon-rust/horizon.git
          git -C horizon fetch --depth 1 origin "$HORIZON_REV"
          git -C horizon checkout "$HORIZON_REV"
          # The stager refuses symlinks; this pinned rev holds one (CLAUDE.md
          # -> AGENTS.md). Materialize every tracked symlink as a regular
          # file with its formerly linked content.
          for link in $(git -C horizon ls-files -s | awk '$1 == 120000 {print $4}'); do
            target=$(git -C horizon cat-file blob "HEAD:$link")
            rm -f "horizon/$link"
            cp "horizon/$target" "horizon/$link" 2>/dev/null || : > "horizon/$link"
          done

      - name: The horizon-mixins tool
        run: |
          git clone https://github.com/horizon-rust/horizon-mixins.git mixins
          git -C mixins checkout "$MIXINS_REV"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "${{ env.RUST }}"
          components: rustfmt

      - name: Linux system dependencies (the pinned workspace's headers)
        # Horizon's Linux build needs the ALSA and udev headers
        # (CONTRIBUTING.md: "libasound2-dev libudev-dev"); the runner lacks them.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Tool dependencies
        run: cargo fetch --locked --manifest-path mixins/Cargo.toml

      - name: Workspace dependencies (the planner resolves the lock offline)
        run: cargo fetch --locked --manifest-path horizon/Cargo.toml

      - name: Generate the lane tables
        # A failure keeps the committed tables; the build stays whole.
        run: python3 mod/tools/generate_data.py --horizon-src horizon || true

      - name: Plan and apply the mixins (staged workspace)
        # The staged workspace is a complete copy of Horizon with the mod
        # applied. It must sit outside the checkout (the mod dir is the
        # checkout itself), with no `..` in the path — the runner's per-job
        # temp dir satisfies both.
        run: |
          cargo install --path mixins/crates/horizon-mixins-cli --locked
          # plan and apply take separate --out directories: a directory left by
          # standalone plan carries plan ownership, and apply refuses to replace
          # it (E_STAGE_OWNERSHIP). The apply stage is the build's workspace.
          horizon-mixins plan --workspace horizon --mods . --out "$RUNNER_TEMP/plan"
          horizon-mixins apply --workspace horizon --mods . --out "$RUNNER_TEMP/stage"

      - name: Cargo check the engine's crates (offline, locked)
        run: cd "$RUNNER_TEMP/stage" && cargo check --locked --offline -p horizon-protocol && cargo check --locked --offline -p horizon-client

      - name: Package the .hnmod
        run: |
          cp README.md mod/README.md
          cd mod
          zip -r "../horizon-legacy-join-${{ github.run_number }}.hnmod" \
            horizon-mixin.toml helpers engine legacy_data README.md

      - name: Publish the release (alpha, rising per run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Horizon Legacy Join **alpha build** — alpha.${{ github.run_number }}.

          - Pinned to Horizon Nightly at ${{ env.HORIZON_REV }} (Nov 2026 main).
          - Every legacy lane is in: **all 35 joinable releases from 1.8.x (47)
            through 1.20.1 (763)** carry per-release packet id tables,
            name-matched against 1.20.3 (the bridge's own era) and composed
            per build from PrismarineJS/minecraft-data. 1.20.2+ keep working
            through upstream's own adapter, now permanently on.
          - Spectrum audit (the lane-table step logs it every build): every
            advertised release 1.8.x (47) .. 26.3 (777) joins through exactly
            one translator — this mod's lanes below 764, upstream's own
            adapter from 1.20.2 (764) up, nothing shadowed.
          - The lone refusal: **1.14.2 (485)** — no minecraft-data document
            resolves to it yet.
          - Id-level alpha: packets are translated by identity (packet ids),
            not by era payload layouts. Joins into pre-flattening eras
            (roughly 1.8..1.14) degrade mid-play or die at login when a packet
            body diverges; newer lanes translate furthest. Translating the era
            layouts themselves is the next milestone.
          - Display note: the server list marks 1.8.x–1.20.1 entries
            "incompatible" (a resolver hook the planner cannot express yet is
            pending); the Join button on the entry still joins them.
          - Alpha quality: ints may shed on exotic packets (the game tolerates
            unknowns); reports welcome with the log's lane notices.
          EOF
          gh release create "alpha.${{ github.run_number }}" \
            --title "alpha.${{ github.run_number }}: all 1.8..1.20.1 lanes wired" \
            --notes-file notes.md \
            "horizon-legacy-join-${{ github.run_number }}.hnmod"

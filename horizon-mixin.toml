# Horizon Legacy Join — join servers of 1.8.x..1.20.1 from Horizon.
# Native mod bundle: hooks into the game's own network stack before the handshake,
# and drives a per-connection legacy bridge inside horizon-protocol's adapter.
[mod]
id = "horizon-legacy-join"
version = "0.1.0"
priority = 10

# The Nightly commit (tag `nightly[14706039]: "Next Steps: extend ID helpers (#8718)"` base) this
# bundle was made and CI-checked against — Nov 8 2026 main. Re-pin after every upstream update.
[compatibility]
horizon_revision = "5f7cadfff0fc073c0e4a68558754578c0d680a29"

# ---------------------------------------------------------------- helpers ---
# 1. Open the gate (it is off by default while the adapter is incomplete).
[[injection]]
id = "open_older_servers"
target = "horizon_client::net::older_servers_enabled"
kind = "OVERWRITE"
helper = "helpers/older_servers_enabled.rs"

# 2. Resolve what the server speaks by its status ping; remember it for adapt.
[[injection]]
id = "resolve_older_server"
target = "horizon_client::net::older_server"
kind = "OVERWRITE"
helper = "helpers/older_server.rs"
bindings = [{ name = "address", ty = "&str", value = "address" }]

# 3. Make the server list show legacy servers as joinable (the version name
#    on the list still comes from the ping's own json).
[[injection]]
id = "recognize_legacy_protocols"
target = "horizon_protocol::adapter::ServerVersion::from_protocol"
kind = "OVERWRITE"
helper = "helpers/from_protocol.rs"
bindings = [{ name = "protocol", ty = "i32", value = "protocol" }]

# 4. Attach the legacy bridge (or upstream's own session for 1.20.2+).
[[injection]]
id = "adapt_connection"
target = "horizon_protocol::connection::Connection::adapt"
kind = "OVERWRITE"
helper = "helpers/adapt.rs"
bindings = [
  { name = "conn", ty = "&mut Connection", value = "&mut *self" },
  {
    name = "version",
    ty = "crate::adapter::ServerVersion",
    value = "version",
  },
]

# 5. The reader: drain the bridge's queue first, translate what arrives.
[[injection]]
id = "reader_recv"
target = "horizon_protocol::connection::ConnReader::recv"
kind = "OVERWRITE"
helper = "helpers/recv.rs"
bindings = [{ name = "reader", ty = "&mut ConnReader", value = "&mut *self" }]

# 6. The writer: translate before framing, flush extra packets after.
[[injection]]
id = "writer_send"
target = "horizon_protocol::connection::ConnWriter::send"
kind = "OVERWRITE"
helper = "helpers/send.rs"
bindings = [
  { name = "writer", ty = "&mut ConnWriter", value = "&mut *self" },
  { name = "body", ty = "&[u8]", value = "body" },
]

# ---------------------------------------------------------------- modules ---
# The whole legacy engine, inside the adapter module tree (same-crate privacy:
# it can read the adapter's private submodules, tables and the legacy registries).
[[module]]
id = "engine"
file = "crates/horizon-protocol/src/adapter.rs"
name = "legacy_join"
source = "engine/legacy_bridge.rs"
visibility = "pub"

# ------------------------------------------------------------ the crate ------
# The generated lane tables: a crate of the mod's own, compiled into
# horizon-protocol (the engine's home crate). No repository dependencies: the
# tables are those consts, generated by tools/generate_data.py.
[[crate]]
id = "legacy_data"
path = "legacy_data"
dependent = "horizon-protocol"

# ---------------------------------------------------------------- state ------
# The bridge itself, one per connection half (constructed in Connection::over).
[[state]]
id = "reader_bridge"
target = "horizon_protocol::connection::ConnReader"
ty = "Option<Arc<Mutex<crate::adapter::legacy_join::Bridge>>>"
initial = "::core::option::Option::None"

[[state.constructor]]
target = "horizon_protocol::connection::Connection::over"
selector = "ConnReader"
require = 1

[[state]]
id = "writer_bridge"
target = "horizon_protocol::connection::ConnWriter"
ty = "Option<Arc<Mutex<crate::adapter::legacy_join::Bridge>>>"
initial = "::core::option::Option::None"

[[state.constructor]]
target = "horizon_protocol::connection::Connection::over"
selector = "ConnWriter"
require = 1
